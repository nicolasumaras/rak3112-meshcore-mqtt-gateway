[platformio]
default_envs = lilygo_lora32_v21

[env:esp32_mqtt_gateway]
platform = espressif32
board = esp32dev
framework = arduino

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DMeshCore_MQTT_GATEWAY

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps = 
    jgromes/RadioLib@^6.6.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3

; Upload settings
upload_speed = 115200

[env:lilygo_lora32_v21]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DLILYGO_LORA32_V21
    -DMeshCore_MQTT_GATEWAY

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps = 
    jgromes/RadioLib@^6.6.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3

upload_speed = 115200
upload_flags =
    --no-stub
    --baud
    115200

[env:rak3112_mqtt]
; RAK3112 (ESP32-S3 + SX1262).
; Board/flags mirror meshcore-dev/MeshCore @ 03b6ef4, variants/rak3112/platformio.ini.
; Platform is pinned here (other envs leave it floating) because ESP32-S3 support
; quality varies across releases; 6.11.0 is what MeshCore builds this board with.
platform = platformio/espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DRAK_3112
    -DMeshCore_MQTT_GATEWAY
    ; Mandatory: ESP32-S3 native USB. Without this there is no serial console,
    ; and the serial console is the only way to configure WiFi/MQTT.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Deliberately NO -DBOARD_HAS_PSRAM: upstream MeshCore sets no PSRAM flags for
    ; this board, and the stock esp32-s3-devkitc-1 definition is the no-PSRAM N8.

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    jgromes/RadioLib@^6.6.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3

upload_speed = 921600

